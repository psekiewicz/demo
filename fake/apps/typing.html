<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Typing Race</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header><h1>Typing Race</h1><span>Type the line</span></header>
  <main>
    <p id="text" style="font-size:22px;max-width:600px;text-align:center;letter-spacing:.02em"></p>
    <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:min(600px,100%);padding:12px 16px;border-radius:14px;border:1px solid #555;background:#0003;font-size:18px" placeholder="Start typing" />
    <div class="row"><span id="wpm" class="hint">0 WPM</span><button id="next">New line</button></div>
  </main>
  <script type="module">
    import { rng } from './app.js';
    const LINES = ['the quick brown fox jumps over the lazy dog', 'small things shipped beat big things planned', 'make it work then make it fast then make it pretty', 'every demo starts as a bad first version', 'pixels and patience make a game', 'try it in a tap and tell me what breaks'];
    const r = rng(); let line, start;
    const text = document.getElementById('text'), input = document.getElementById('in');
    function next() { line = LINES[Math.floor(r() * LINES.length)]; input.value = ''; start = null; render(); input.focus(); }
    function render() {
      const typed = input.value;
      text.innerHTML = [...line].map((ch, i) => '<span style="color:' + (i < typed.length ? (typed[i] === ch ? 'var(--accent)' : '#ff6b6b') : 'var(--muted)') + '">' + ch + '</span>').join('');
      if (start && typed.length) document.getElementById('wpm').textContent = Math.round((typed.length / 5) / ((Date.now() - start) / 60000)) + ' WPM';
      if (typed === line) document.getElementById('wpm').textContent += ' - done!';
    }
    input.addEventListener('input', () => { start ||= Date.now(); render(); });
    document.getElementById('next').onclick = next;
    next();
  </script>
</body>
</html>

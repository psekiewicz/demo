<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Focus</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header><h1>Focus</h1><span>25 / 5</span></header>
  <main>
    <canvas id="c"></canvas>
    <div class="row"><button class="primary" id="go">Start</button><button id="reset">Reset</button></div>
    <p class="hint" id="mode">Focus</p>
  </main>
  <script type="module">
    import { fitCanvas, hue } from './app.js';
    const S = Math.min(300, innerWidth - 32), c = document.getElementById('c'), ctx = fitCanvas(c, S, S);
    const LEN = { Focus: 25 * 60, Break: 5 * 60 };
    let mode = 'Focus', left = LEN[mode], timer = null;
    function draw() {
      ctx.clearRect(0, 0, S, S);
      ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.strokeStyle = 'hsl(' + hue + ' 30% 22%)'; ctx.beginPath(); ctx.arc(S / 2, S / 2, S / 2 - 16, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'hsl(' + (mode === 'Focus' ? hue : hue + 140) + ' 85% 62%)'; ctx.beginPath(); ctx.arc(S / 2, S / 2, S / 2 - 16, -Math.PI / 2, -Math.PI / 2 + (left / LEN[mode]) * Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#f5f3ee'; ctx.font = '600 ' + S / 5 + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'), S / 2, S / 2);
      document.getElementById('mode').textContent = mode;
    }
    function tick() { left--; if (left < 0) { mode = mode === 'Focus' ? 'Break' : 'Focus'; left = LEN[mode]; try { new AudioContext().resume(); } catch {} } draw(); }
    document.getElementById('go').onclick = (e) => { if (timer) { clearInterval(timer); timer = null; e.target.textContent = 'Start'; } else { timer = setInterval(tick, 1000); e.target.textContent = 'Pause'; } };
    document.getElementById('reset').onclick = () => { left = LEN[mode]; draw(); };
    draw();
  </script>
</body>
</html>
